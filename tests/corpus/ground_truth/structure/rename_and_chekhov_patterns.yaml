# Chekhov plant → mid → payoff. Plants use CAPS so prop extraction fires;
# mid/payoff may be lowercase aliases the soft-matcher should resolve.
chekhov_patterns:
  - plant: a BRASS KEY
    mid: the key
    payoff: the key
  - plant: a STEEL BRIEFCASE
    mid: the briefcase
    payoff: the briefcase
  - plant: a REVOLVER
    mid: the revolver
    payoff: the revolver
  - plant: a sealed LETTER
    mid: the letter
    payoff: the letter
  - plant: a GOLD LOCKET
    mid: the locket
    payoff: the locket
  - plant: a WHITE TOWEL
    mid: the towel
    payoff: the towel
