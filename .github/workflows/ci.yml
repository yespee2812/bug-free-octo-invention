name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  test-and-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Cache Hugging Face model downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-osd-minilm-${{ runner.os }}-v1
          restore-keys: |
            huggingface-osd-minilm-${{ runner.os }}-

      - name: Pre-cache OSD semantic model
        run: python scripts/precache_osd_semantic.py

      - name: Run unit tests
        run: python -m pytest tests/ -q

      - name: Run orphan-spec golden eval
        run: python scripts/run_orphan_spec_eval.py

  # Legacy contradiction-detection corpus. Plot contradictions are out of the
  # v3 product scope, so this no longer gates PRs/merges. It runs only on
  # manual dispatch to preserve the NLP regression signal on demand.
  legacy-contradiction-baseline:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Cache Hugging Face model downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-osd-minilm-${{ runner.os }}-v1
          restore-keys: |
            huggingface-osd-minilm-${{ runner.os }}-

      - name: Pre-cache OSD semantic model
        run: python scripts/precache_osd_semantic.py

      - name: Run legacy contradiction unit tests
        run: python -m pytest legacy/tests/ -q

      - name: Run corpus batch against planted ground truth
        run: >-
          python scripts/run_corpus_batch.py
          --compare-ground-truth
          --ground-truth-dir legacy/corpus/ground_truth

      - name: Enforce corpus baseline thresholds
        run: >-
          python scripts/score_corpus_baseline.py
          --check
          --min-recall 1.0
          --max-false-positives 4
