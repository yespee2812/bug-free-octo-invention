<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-label="ScriptLens dependency graph for the demo script"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b2933a"/></marker></defs><rect width="960" height="620" fill="#0d0d0d"/><text x="40" y="46" font-size="22" font-weight="700" fill="#f0d77b" font-family="Georgia, serif">How ScriptLens reads a script</text><text x="40" y="70" font-size="13" fill="#9a927d" font-family="Verdana, sans-serif">Real output for the demo script "DOCKS RUN" (5 scenes). Every arrow is a structural link the engine actually found.</text><path d="M 252,372 L 360,372" fill="none" stroke="#b2933a" stroke-width="4.2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="300" y="362" font-size="11" fill="#9a927d" font-family="Verdana, sans-serif">0.40</text><path d="M 252,360 C 430,306 560,300 668,288" fill="none" stroke="#b2933a" stroke-width="3.12" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="515" y="312" font-size="11" fill="#9a927d" font-family="Verdana, sans-serif">0.23</text><path d="M 160,404 C 320,560 540,540 668,456" fill="none" stroke="#b2933a" stroke-width="3.77" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="405" y="548" font-size="11" fill="#9a927d" font-family="Verdana, sans-serif">0.33</text><path d="M 544,372 L 668,288" fill="none" stroke="#b2933a" stroke-width="2.9" marker-end="url(#arrow)"/><text x="588" y="320" font-size="11" fill="#9a927d" font-family="Verdana, sans-serif">0.20</text><path d="M 544,372 L 668,456" fill="none" stroke="#b2933a" stroke-width="4.63" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="588" y="424" font-size="11" fill="#9a927d" font-family="Verdana, sans-serif">0.47</text><text x="160" y="330" font-size="11" font-weight="700" fill="#d4af37" text-anchor="middle" font-family="Verdana, sans-serif">SETUP - briefcase introduced</text><text x="760" y="506" font-size="11" font-weight="700" fill="#d4af37" text-anchor="middle" font-family="Verdana, sans-serif">PAYOFF - the handoff</text><g><rect x="68" y="340" width="184" height="64" rx="12" fill="#151515" stroke="#d4af37" stroke-width="2"/><text x="84" y="366" font-size="13" font-weight="700" fill="#d4af37" font-family="Verdana, sans-serif">SCENE 1</text><text x="84" y="388" font-size="14" fill="#f3ead3" font-family="Georgia, serif">Abandoned Warehouse</text></g><g opacity="0.9"><rect x="360" y="100" width="184" height="64" rx="12" fill="#1a1206" stroke="#c67b3c" stroke-width="2" stroke-dasharray="7 5"/><text x="376" y="126" font-size="13" font-weight="700" fill="#c67b3c" font-family="Verdana, sans-serif">SCENE 2</text><text x="376" y="148" font-size="14" fill="#f3ead3" font-family="Georgia, serif">Rain-Slick Alley</text></g><g><rect x="360" y="340" width="184" height="64" rx="12" fill="#151515" stroke="#d4af37" stroke-width="2"/><text x="376" y="366" font-size="13" font-weight="700" fill="#d4af37" font-family="Verdana, sans-serif">SCENE 3</text><text x="376" y="388" font-size="14" fill="#f3ead3" font-family="Georgia, serif">Parking Garage</text></g><g><rect x="668" y="256" width="184" height="64" rx="12" fill="#151515" stroke="#d4af37" stroke-width="2"/><text x="684" y="282" font-size="13" font-weight="700" fill="#d4af37" font-family="Verdana, sans-serif">SCENE 4</text><text x="684" y="304" font-size="14" fill="#f3ead3" font-family="Georgia, serif">Safehouse</text></g><g><rect x="668" y="424" width="184" height="64" rx="12" fill="#151515" stroke="#d4af37" stroke-width="2"/><text x="684" y="450" font-size="13" font-weight="700" fill="#d4af37" font-family="Verdana, sans-serif">SCENE 5</text><text x="684" y="472" font-size="14" fill="#f3ead3" font-family="Georgia, serif">Docks</text></g><line x1="544" y1="132" x2="612" y2="132" stroke="#c67b3c" stroke-width="1.5" stroke-dasharray="4 4"/><text x="620" y="122" font-size="13" font-weight="700" fill="#c67b3c" font-family="Verdana, sans-serif">Orphan scene</text><text x="620" y="142" font-size="12" fill="#9a927d" font-family="Verdana, sans-serif">0 links in, 0 links out</text><text x="620" y="160" font-size="12" fill="#9a927d" font-family="Verdana, sans-serif">nothing sets it up; nothing needs it</text><g font-family="Verdana, sans-serif"><rect x="40" y="566" width="22" height="16" rx="4" fill="#151515" stroke="#d4af37" stroke-width="2"/><text x="70" y="579" font-size="12" fill="#f3ead3">Connected scene</text><rect x="214" y="566" width="22" height="16" rx="4" fill="#1a1206" stroke="#c67b3c" stroke-width="2" stroke-dasharray="4 3"/><text x="244" y="579" font-size="12" fill="#f3ead3">Orphan scene</text><line x1="372" y1="574" x2="410" y2="574" stroke="#b2933a" stroke-width="3" marker-end="url(#arrow)"/><text x="420" y="579" font-size="12" fill="#f3ead3">Dependency (shared characters / objects) - thicker = stronger</text></g></svg>